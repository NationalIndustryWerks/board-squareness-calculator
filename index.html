<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Squareness Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>BOARD SQUARENESS CALCULATOR</h1>

    <label>Length</label>
    <select id="length">
        <option value="72">72"</option>
        <option value="96">96"</option>
        <option value="108">108"</option>
        <option value="120">120"</option>
        <option value="144">144"</option>
        <option value="168">168"</option>
        <option value="192">192"</option>
    </select>

    <label>Custom Length</label>
    <input id="customLength" type="number">

    <p id="usingLength">Using Length: 72"</p>

    <label>Width</label>
    <select id="width">
        <option value="48">48"</option>
        <option value="54">54"</option>
    </select>

    <label>Tolerance</label>
    <input id="tolerance" value="3/32">

    <p id="toleranceDisplay"></p>

    <label>Diagonal 1</label>
    <input id="diag1" placeholder="107 1/16">

    <label>Diagonal 2</label>
    <input id="diag2" placeholder="107 1/4">

    <button onclick="calculate()">CALCULATE</button>

    <button onclick="showHistory()">HISTORY</button>

    <button onclick="clearHistory()">CLEAR HISTORY</button>

    <div id="resultBox">READY</div>

    <p id="difference"></p>
    <p id="outSquare"></p>
    <p id="perfectDiagonal"></p>

    <hr>

    <h2>Fraction → Decimal Converter</h2>

    <input id="fractionInput" placeholder="107 1/16">

    <button onclick="convertFraction()">CONVERT</button>

    <p id="decimalOutput"></p>

</div>

<script src="script.js"></script>

</body>
</html>
